<text x="590" y="813" font-size="21" fill="#526371" text-anchor="start" font-weight="400">D3 carries the control signal only.</text>
<text x="590" y="847" font-size="20" fill="#526371" text-anchor="start" font-weight="400">A bare two-wire buzzer may need a separate driver.</text>
<text x="590" y="879" font-size="20" fill="#526371" text-anchor="start" font-weight="400">The prototype itself used a two-wire active buzzer on D3.</text>
